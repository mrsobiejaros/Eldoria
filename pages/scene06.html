<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eldoria - La rue en feu</title>

    <link rel="stylesheet" href="../assets/css/characters.css">
    <link rel="stylesheet" href="../assets/css/inventory.css">
    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/protest.css">
</head>

<body
    data-music="../assets/sounds/combat.mp3"
    data-music-loop="false"
    data-music-volume="0.35"
>

    <main id="game">
        <div id="sceneWorld"></div>
        <div id="hazardLayer"></div>
        <div id="pickupLayer"></div>
        <div id="npcLayer"></div>
        <div id="effectsLayer"></div>

        <div id="player">
            <div id="youLabel">YOU</div>
        </div>

        <div id="sceneHud">
            <div id="sceneTitle">La rue en feu</div>
            <div id="sceneFlavor"></div>
            <div id="roleName"></div>
            <div id="objectiveText"></div>

            <div id="healthRow" class="hudRow">
                <span>Vie</span>

                <div class="hudTrack">
                    <div id="healthFill"></div>
                </div>

                <span id="healthValue">100</span>
            </div>

            <div id="questRow" class="hudRow">
                <span>Quête</span>

                <div class="hudTrack">
                    <div id="questFill"></div>
                </div>

                <span id="questValue">0 / 10</span>
            </div>

            <div id="resourceRow"></div>

            <div id="specialRow">
                <div id="specialHeader">
                    <span id="specialName">Pouvoir spécial</span>
                    <span id="specialCooldown">X</span>
                </div>
                <div id="specialDescription"></div>
            </div>
        </div>

        <div id="gameMessage"></div>

        
        <div id="choiceOverlay">
            <div id="choicePanel">
                <div id="choiceScene"></div>
                <h2>Choisis ta tactique</h2>
                <p id="choiceIntro"></p>
                <div id="choiceButtons"></div>
            </div>
        </div>

        <div id="questCompleteOverlay">
            <div id="questCompleteBox">
                Quête validée !
            </div>
        </div>

        <button id="leaveScene" type="button">
            E - Quitter
        </button>
    </main>

    <script src="../assets/js/characters.js"></script>
    <script src="../assets/js/inventory.js"></script>
    <script src="../assets/js/missions.js"></script>
    <script src="../assets/js/scene06.js"></script>
    <script src="../assets/js/protestEngine.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/music.js"></script>
</body>
</html>
