        <div id="endingBackground"></div>
        <div id="endingVignette"></div>
        <div id="endingDust"></div>

        <div id="endingPlayer"></div>

        <section id="endingStory">
            <div id="endingEyebrow">
                ELDORIA
            </div>

            <h1 id="endingTitle">
                Une histoire s'achève.
            </h1>

            <div id="endingRole"></div>

            <p id="endingText"></p>

            </p>

            <button
                id="endingContinue"
                type="button"
            >
                Continuer
            </button>

        <div id="endingTease">
            <span>Quelque part, une nouvelle carte vient de s'allumer...</span>
            <strong>ELDORIA // II</strong>
        </div>

        <div id="endingCredits">
            FIN
        </div>

    </main>

    <script src="../assets/js/characters.js"></script>
    <script src="../assets/js/missions.js"></script>
