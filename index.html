<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body
    data-music="/assets/sounds/lobby.mp3"
    data-music-loop="true"
    data-music-volume="0.35"
>
    <main id="characterSelection">
        <section id="selectionPanel">
            <h1>Eldoria</h1>
            <p>Choisis ton personnage</p>

            <div id="characterChoices">
                <button id="choiceMen" class="characterChoice">
                    <img src="assets/characters/player_men.png" alt="Personnage homme">
                    <span>Homme</span>
                </button>

                <button id="choiceGirl" class="characterChoice">
                    <img src="assets/characters/player_girl.png" alt="Personnage femme">
                    <span>Femme</span>
                </button>
            </div>
        </section>
    </main>

    <script src="assets/js/characters.js"></script>
    <script src="assets/js/index.js"></script>
    <script src="assets/js/music.js"></script>
</body>
</html>
